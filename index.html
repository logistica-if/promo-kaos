/* login estilo afiche */

/* check-in */
.ci-search{display:flex;gap:8px;margin-bottom:12px}

<body>
<div id="app"></div>
<script>
'use strict';
// =====================================================================
//  Utilidades
// =====================================================================
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Number(n || 0).toLocaleString('es-AR');
const fmtDT = d => d ? new Date(d).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const fmtFecha = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const RESTRICCIONES = ['Sin restricción', 'Celíaco', 'Vegetariano', 'Hipertenso', 'Otra'];
const MEDIOS = ['Transferencia', 'Mercado Pago', 'Efectivo', 'Otro'];
let S = store.get('egreso_sesion');   // {token, rol, nombre, codigo}
let CFG = null;                        // config del evento (según vista)
const BRAND = { promo: 'Promo KAOS', lema: 'Una última noche, mil recuerdos', ...(window.APP_CONFIG?.BRAND || {}) };

function catLabel(c, cfg = CFG) {
  const b = cfg?.edad_max_bebe ?? 2, m = cfg?.edad_max_menor ?? 12;
  return c === 'bebe' ? `0–${b} años` : c === 'menor' ? `${b + 1}–${m} años` : 'Adulto';
}
function restrTxt(i) { return i.restriccion === 'Otra' ? 'Otra: ' + (i.restriccion_detalle || '') : i.restriccion; }
function estadoBadge(i) {
  if (i.ingreso_at) return '<span class="b ing">INGRESÓ</span>';
  if (i.vencido) return '<span class="b vencido">VENCIDO</span>';
  return `<span class="b ${i.estado}">${i.estado.toUpperCase()}</span>`;
}
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2600);
}
const loaded = {};
function loadScript(src) {
  if (!loaded[src]) loaded[src] = new Promise((ok, ko) => {
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('No se pudo cargar ' + src));
    document.head.appendChild(s);
  });
  return loaded[src];
}
const LIB = {
  qr: 'qrcode.js',
  xlsx: 'xlsx.full.min.js',
  scan: 'html5-qrcode.min.js'
};

// =====================================================================
//  API (Supabase RPC)
// =====================================================================
async function rpc(fn, args = {}) {
  const base = (window.APP_CONFIG?.SUPABASE_URL || '').replace(/\/$/, '');
  const key = window.APP_CONFIG?.SUPABASE_ANON_KEY || '';
  const headers = { 'apikey': key, 'Content-Type': 'application/json' };
  if (key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + key;
  let res;
  try {
    res = await fetch(base + '/rest/v1/rpc/' + fn, { method: 'POST', headers, body: JSON.stringify(args) });
  } catch (e) {
    const err = new Error('Sin conexión con el servidor. Revisá internet e intentá de nuevo.'); err.offline = true; throw err;
  }
  const txt = await res.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
  if (!res.ok) {
    let msg = (data && (data.message || data.hint || data.error)) || ('Error ' + res.status);
    if (String(msg).startsWith('SESION:')) { logout(true); msg = msg.slice(7).trim(); }
    throw new Error(String(msg).replace(/^(AFORO|CUPO|BRINDIS):\s*/, ''));
  }
  return data;
}
const T = () => S?.token;
async function run(fn, okMsg) {       // ejecuta acción con manejo de errores
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); throw e; }
}

// =====================================================================
//  Modal
// =====================================================================
function modal(title, body, { wide = false, actions = null, onOpen = null } = {}) {
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = `<div class="md ${wide ? 'w' : ''}"><h3>${esc(title)}</h3><div class="mb">${body}</div>
      <div class="acts">${(actions || [{ t: 'Cerrar', v: null }]).map((a, k) => `<button class="btn ${a.c || ''}" data-k="${k}">${esc(a.t)}</button>`).join('')}</div></div>`;
    const acts = actions || [{ t: 'Cerrar', v: null }];
    const close = v => { ov.remove(); resolve(v); };
    ov.addEventListener('click', async e => {
      if (e.target === ov) return close(null);
      const b = e.target.closest('[data-k]'); if (!b) return;
      const a = acts[+b.dataset.k];
      if (a.fn) {
        b.disabled = true;
        try { const r = await a.fn(ov); if (r !== false) close(r === undefined ? true : r); }
        catch (err) { toast(err.message, true); }
        finally { b.disabled = false; }
      } else close(a.v);
    });
    document.body.appendChild(ov);
    const first = ov.querySelector('input,select,textarea'); if (first && !('ontouchstart' in window)) first.focus();
    if (onOpen) onOpen(ov, close);
  });
}
const confirmar = (title, msg, t = 'Confirmar', c = 'p') => modal(title, `<p>${msg}</p>`, { actions: [{ t: 'Cancelar', v: false }, { t, c, v: true }] });
function formData(root) {
  const o = {}; $$('[name]', root).forEach(el => { o[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim(); }); return o;
}
const opt = (v, t, sel) => `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(t ?? v)}</option>`;

// =====================================================================
//  Arranque / router
// =====================================================================
function shell(sub, tabs, active) {
  $('#app').innerHTML = `
  <div class="top"><div><div class="t1">${esc(BRAND.promo)}</div>
    <div class="t2">${esc(CFG?.evento || '')} · ${esc(sub)}</div></div><div class="sp"></div>
    <button onclick="logout()">Salir</button></div>
  ${tabs ? `<nav class="tabs">${tabs.map(t => `<button data-tab="${t.id}" class="${t.id === active ? 'on' : ''}">${esc(t.t)}${t.dot ? `<span class="dot">${t.dot}</span>` : ''}</button>`).join('')}</nav>` : ''}
  <main id="main"><div class="empty">Cargando…</div></main>`;
}
function logout(silent) {
  if (S?.token && !silent) rpc('logout', { p_token: S.token }).catch(() => { });
  S = null; ADM.tab = 'resumen'; ADM.filtro = {}; store.del('egreso_sesion'); location.hash = ''; route();
}
function route() {
  const m = location.hash.match(/e=([0-9a-f]{32})/);
  if (m) return viewTicketPublic(m[1]);
  if (!window.APP_CONFIG || APP_CONFIG.SUPABASE_URL.includes('TU-PROYECTO')) return viewSinConfig();
  if (!S) return viewLogin();
  if (S.rol === 'admin') return viewAdmin();
  if (S.rol === 'egresado') return viewEgresado();
  return viewCheckin();
}
window.addEventListener('hashchange', route);

function viewSinConfig() {
  $('#app').innerHTML = `<div class="login"><div class="card"><h3>Falta configurar</h3>
  <p>Editá el archivo <b>config.js</b> con la URL y la clave <i>anon</i> de tu proyecto Supabase (ver guía de instalación).</p></div></div>`;
}

// =====================================================================
//  Login
// =====================================================================
async function viewLogin() {
  const pn = BRAND.promo.replace(/^promo\s+/i, '');
  $('#app').innerHTML = `<div class="poster-bg"><i></i><i></i><b></b></div><div class="login"><div class="logo">
    ${/^promo\s/i.test(BRAND.promo) ? '<div class="promo">PROMO</div>' : ''}<div class="kaos">${esc(pn.toUpperCase())}</div>
    <div class="lema">${esc(BRAND.lema)}</div><div class="sep">✦</div>
    <div class="fechaev" id="lg-sub"></div><div class="fechaev" id="lg-ev" style="font-size:12px;opacity:.8;margin-top:4px"></div><div class="sep">✦</div></div>
    <div class="card ticketbox" id="lg-card"><div class="empty">Conectando…</div></div></div>`;
  let st;
  try { st = await rpc('estado_inicial'); }
  catch (e) { $('#lg-card').innerHTML = `<div class="notice bad">${esc(e.message)}</div><button class="btn" onclick="route()">Reintentar</button>`; return; }
  $('#lg-ev').textContent = st.evento;
  const fd = new Date(st.fecha + 'T12:00:00');

function ticketURL(qr) { return location.origin + location.pathname + '#e=' + qr; }
async function drawTicket(t) {
  await loadScript(LIB.qr);
  try { await Promise.all(['900 100px "Playfair Display"', '600 40px "Playfair Display"', '40px Sacramento'].map(f => document.fonts.load(f))); } catch (e) { }
  const SERIF = '"Playfair Display",Georgia,serif', SCRIPT = 'Sacramento,cursive';
  const W = 1080, H = 1700, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const PUR = '#3b1a78', INK = '#2a1552', LILA = '#9b7fd6', CREAM = '#f6efdf';
  const ls = v => { if ('letterSpacing' in x) x.letterSpacing = v + 'px'; };
  const rr = (X, Y, w, h, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); };
  const star = (cx, cy, r) => { x.beginPath(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 - Math.PI / 2, rad = k % 2 ? r * .28 : r; x.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); } x.closePath(); x.fill(); };
  const fit = (txt, font, max, size, min) => { x.font = font(size); while (x.measureText(txt).width > max && size > min) { size -= 2; x.font = font(size); } };
  const sep = (y) => { x.strokeStyle = PUR; x.lineWidth = 3; x.beginPath(); x.moveTo(W / 2 - 170, y); x.lineTo(W / 2 - 40, y); x.moveTo(W / 2 + 40, y); x.lineTo(W / 2 + 170, y); x.stroke(); x.fillStyle = PUR; star(W / 2, y, 20); };
  // fondo tipo afiche
  x.fillStyle = CREAM; x.fillRect(0, 0, W, H);
  x.fillStyle = '#4b2594';
  x.beginPath(); x.ellipse(40, -40, 330, 250, -0.25, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.ellipse(W - 10, H + 30, 320, 260, -0.3, 0, Math.PI * 2); x.fill();
  x.strokeStyle = '#b39ae8'; x.lineWidth = 5;
  x.beginPath(); x.moveTo(0, 330); x.bezierCurveTo(200, 300, 330, 120, 420, 0); x.stroke();
  x.beginPath(); x.moveTo(W, 1290); x.bezierCurveTo(930, 1400, 900, 1560, 760, H); x.stroke();
  x.fillStyle = PUR; star(960, 120, 34); star(70, 1560, 34);
  x.textAlign = 'center';
  // encabezado
  const promoTxt = BRAND.promo, m = promoTxt.match(/^promo\s+(.+)$/i);
  x.fillStyle = PUR;
  if (m) { x.font = `600 58px ${SERIF}`; ls(8); x.fillText('PROMO', W / 2, 150); ls(0);
    x.fillRect(W / 2 - 250, 132, 70, 3); x.fillRect(W / 2 + 180, 132, 70, 3); }
  fit((m ? m[1] : promoTxt).toUpperCase(), z => `900 ${z}px ${SERIF}`, W - 220, 190, 70);
  ls(4); x.fillText((m ? m[1] : promoTxt).toUpperCase(), W / 2, 310); ls(0);
  x.fillStyle = LILA; x.font = `72px ${SCRIPT}`; x.fillText(BRAND.lema, W / 2, 395);
  sep(445);
  const fd = new Date(t.fecha + 'T12:00:00');
  x.fillStyle = INK; x.font = `600 42px ${SERIF}`; ls(4);
  x.fillText(`${fd.getDate()} ${fd.toLocaleDateString('es-AR', { month: 'long' }).toUpperCase()} · ${t.hora} HS`, W / 2, 515);
  x.fillText(String(t.lugar).toUpperCase(), W / 2, 568); ls(0);
  // tarjeta
  rr(90, 620, W - 180, 980, 34); x.fillStyle = '#fffcf5'; x.fill(); x.strokeStyle = LILA; x.lineWidth = 4; x.stroke();
  rr(108, 638, W - 216, 944, 26); x.strokeStyle = '#d9cbf3'; x.lineWidth = 2; x.stroke();
  x.fillStyle = '#6f6488'; fit(('ENTRADA DIGITAL · ' + t.evento).toUpperCase(), z => `600 ${z}px ${SERIF}`, W - 300, 28, 18); ls(3);
  x.fillText(('ENTRADA DIGITAL · ' + t.evento).toUpperCase(), W / 2, 700); ls(0);
  const nm = (t.nombre + ' ' + t.apellido).toUpperCase();
  x.fillStyle = INK; fit(nm, z => `800 ${z}px ${SERIF}`, W - 280, 68, 36); x.fillText(nm, W / 2, 780);
  const q = qrcode(0, 'M'); q.addData(ticketURL(t.qr)); q.make();
  const n = q.getModuleCount(), cell = Math.floor(500 / (n + 2)), qs = cell * (n + 2), qx = (W - qs) / 2, qy = 815;
  x.fillStyle = '#fff'; x.fillRect(qx, qy, qs, qs); x.fillStyle = '#1e0f40';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect(qx + (k + 1) * cell, qy + (r + 1) * cell, cell, cell);
  const y0 = qy + qs + 70;
  const box = (label, val, cx) => {
    x.fillStyle = '#6f6488'; x.font = `600 28px ${SERIF}`; ls(4); x.fillText(label, cx, y0); ls(0);
    x.fillStyle = PUR; x.font = `800 66px ${SERIF}`; x.fillText(val, cx, y0 + 72);
  };
  box('ENTRADA', t.codigo, W / 2 - 210); box('MESA', t.mesa ? String(t.mesa) : 'A asignar', W / 2 + 210);
  x.strokeStyle = '#d9cbf3'; x.lineWidth = 2; x.beginPath(); x.moveTo(W / 2, y0 - 30); x.lineTo(W / 2, y0 + 80); x.stroke();
  x.fillStyle = '#6f6488'; x.font = '500 27px Inter,system-ui,Arial';
  x.fillText('Válida para UN SOLO ingreso · Personal e intransferible', W / 2, 1515);
  x.fillText('Presentá este QR en la entrada junto con tu DNI', W / 2, 1555);
  if (t.usada) { x.save(); x.translate(W / 2, 1060); x.rotate(-0.35); x.fillStyle = 'rgba(192,38,45,.85)'; x.font = `900 120px ${SERIF}`; x.fillText('UTILIZADA', 0, 0); x.restore(); }
  return c;
}
async function mostrarEntrada(t) {
  const c = await drawTicket(t);
  const url = ticketURL(t.qr);
  const msg = `✨ ${BRAND.promo} – ${BRAND.lema} ✨\nTu entrada (${fmtFecha(t.fecha)}, ${t.hora} hs, ${t.lugar}) – ${t.nombre} ${t.apellido} – ${t.codigo}: ${url}`;
  await modal('Entrada ' + t.codigo, `<div id="tk"></div><p class="small muted" style="margin-top:10px">El QR vale para un solo ingreso. Compartí la imagen o el link.</p>`, {
    actions: [
      { t: 'Descargar', fn: () => { const a = document.createElement('a'); a.download = `entrada-${t.codigo}.png`; a.href = c.toDataURL('image/png'); a.click(); return false; } },
      { t: 'Compartir', c: 'ok', fn: async () => {
          try {
            const blob = await new Promise(r => c.toBlob(r, 'image/png'));
            const file = new File([blob], `entrada-${t.codigo}.png`, { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: msg }); return false; }
          } catch (e) { if (e.name === 'AbortError') return false; }
          window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank'); return false;
        } },
      { t: 'Copiar link', fn: async () => { try { await navigator.clipboard.writeText(url); toast('Link copiado'); } catch (e) { prompt('Copiá el link:', url); } return false; } },
      { t: 'Cerrar', v: null }],
    onOpen: ov => { c.style.cssText = 'width:100%;border-radius:12px'; $('#tk', ov).appendChild(c); }
  });
}

const ADM = { tab: 'resumen', dash: null, invs: null, filtro: {}, sel: new Set() };
const ADM_TABS = [
  { id: 'resumen', t: 'Resumen' }, { id: 'egresados', t: 'Egresados' }, { id: 'invitados', t: 'Invitados' },
  { id: 'pagos', t: 'Pagos' }, { id: 'solicitudes', t: 'Solicitudes' }, { id: 'mesas', t: 'Mesas' },
  { id: 'brindis', t: 'Brindis' }, { id: 'acreditacion', t: 'Acreditación' }, { id: 'exportar', t: 'Exportar' },
  { id: 'config', t: 'Configuración' }];
async function viewAdmin() { admTab(ADM.tab); }
async function admTab(tab) {
  ADM.tab = tab;
  try { ADM.dash = await rpc('dashboard', { p_token: T() }); CFG = ADM.dash.config; }
  catch (e) { if (!S) return; shell('Administración', null); $('#main').innerHTML = `<div class="notice bad">${esc(e.message)}</div><button class="btn" onclick="admTab('${tab}')">Reintentar</button>`; return; }
  const tabs = ADM_TABS.map(t => ({ ...t, dot: t.id === 'solicitudes' ? ADM.dash.aforo.solicitudes_pendientes || '' : t.id === 'pagos' ? ADM.dash.pagos.informados_cant || '' : '' }));
  shell(`Administración · ${S.nombre}`, tabs, tab);
  $$('.tabs button').forEach(b => b.onclick = () => admTab(b.dataset.tab));
  const fn = { resumen: admResumen, egresados: admEgresados, invitados: admInvitados, pagos: admPagos, solicitudes: admSolicitudes,
    mesas: admMesas, brindis: admBrindis, acreditacion: () => viewCheckin(true), exportar: admExportar, config: admConfig }[tab];
  try { await fn(); } catch (e) { $('#main').innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; }
}

function mostrarPIN(codigo, nombre, pin) {
  const url = location.origin + location.pathname;
  const msg = `Hola ${nombre}! Tu acceso al sistema de invitados del Egreso:\n${url}\nUsuario: ${codigo}\nPIN: ${pin}\nNo lo compartas.`;
  return modal('Acceso del egresado', `<p>Anotá o enviá estos datos. <b>El PIN no se vuelve a mostrar</b> (se puede regenerar).</p>
    <div class="kpi" style="text-align:center"><div class="l">Usuario</div><div class="v">${esc(codigo)}</div><div class="l" style="margin-top:8px">PIN</div><div class="v" style="letter-spacing:6px">${esc(pin)}</div></div>`,
    { actions: [{ t: 'Enviar por WhatsApp', c: 'ok', fn: () => { window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank'); return false; } },
      { t: 'Copiar', fn: async () => { try { await navigator.clipboard.writeText(msg); toast('Copiado'); } catch (e) { } return false; } }, { t: 'Listo', c: 'p', v: true }] });
}

// ---- Mesas y reporte por mesa
function reporteMesas(invs, mesas) {
  const act = invs.filter(i => i.estado !== 'cancelado');
  const rows = mesas.map(m => ({ m, L: act.filter(i => i.mesa_id === m.id) }));
  const sin = act.filter(i => !i.mesa_id);
  return { rows, sin };
}
function resumenRestr(L) {
  const c = {}; L.forEach(i => { if (i.restriccion !== 'Sin restricción') { const k = restrTxt(i); c[k] = (c[k] || 0) + 1; } });
  return c;
}

function imprimir(title, html) {
  const w = window.open('', '_blank'); if (!w) return toast('Permití las ventanas emergentes para imprimir', true);
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>
    body{font:12px Arial,sans-serif;margin:18px;color:#000} h1{font-size:18px;margin:0 0 4px} h2{font-size:15px;margin:18px 0 6px;page-break-after:avoid}
    table{border-collapse:collapse;width:100%} th,td{border:1px solid #999;padding:4px 6px;text-align:left} th{background:#eee}
    .pb{page-break-before:always} .box{display:inline-block;width:14px;height:14px;border:1px solid #000} .muted{color:#555}
    @media print{button{display:none}}</style></head><body><button onclick="print()">Imprimir</button>${html}</body></html>`);
  w.document.close();
}

// ---- Exportaciones
async function exportar(nombre, hojas, fmt = 'xlsx') {
  await loadScript(LIB.xlsx);
  const stamp = new Date().toISOString().slice(0, 10);
  if (fmt === 'csv') {
    hojas.forEach(h => { const ws = XLSX.utils.json_to_sheet(h.rows.length ? h.rows : [{ '(sin datos)': '' }]);
      const csv = '﻿' + XLSX.utils.sheet_to_csv(ws, { FS: ';' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = `${nombre}${hojas.length > 1 ? '_' + h.n : ''}_${stamp}.csv`; a.click(); });
    return;
  }
  const wb = XLSX.utils.book_new();
  hojas.forEach(h => { const ws = XLSX.utils.json_to_sheet(h.rows.length ? h.rows : [{ '(sin datos)': '' }]);
    const keys = Object.keys(h.rows[0] || { x: 1 }); ws['!cols'] = keys.map(k => ({ wch: Math.min(40, Math.max(k.length, ...h.rows.slice(0, 200).map(r => String(r[k] ?? '').length)) + 2) }));
    XLSX.utils.book_append_sheet(wb, ws, h.n.slice(0, 31)); });
  XLSX.writeFile(wb, `${nombre}_${stamp}.xlsx`);
}

    ].map(([k, t, d]) => `<div class="it"><div><div class="n">${t}</div><div class="small muted">${d}</div></div><button class="btn s p" data-x="${k}">Descargar</button></div>`).join('')}</div></div>
  <div class="card"><h3>Impresiones de respaldo</h3><div class="row">
    <button class="btn" id="pr-acred">Lista impresa para la entrada (cena)</button><button class="btn" id="pr-brindis">Lista impresa brindis</button><button class="btn" id="pr-mesas">Reporte por mesa</button></div></div>`;
  $$('[data-x]').forEach(b => b.onclick = () => run(async () => {
    const [invs, br, pagos] = await Promise.all([rpc('listar_invitados', { p_token: T() }), rpc('listar_brindis', { p_token: T() }), rpc('listar_pagos', { p_token: T() })]);
    const H = hojasExport(invs, br, pagos); const k = b.dataset.x, fmt = $('#x-fmt').value;
    if (k === 'todo') return exportar('egreso_completo', Object.values(H).flat(), fmt);
    return exportar(H[k][0].file, H[k], fmt);
  }));
  $('#pr-acred').onclick = async () => imprimirAcreditacion(await rpc('listar_invitados', { p_token: T() }));
  $('#pr-brindis').onclick = async () => imprimirBrindis(await rpc('listar_brindis', { p_token: T() }));
  $('#pr-mesas').onclick = async () => imprimirMesas(await rpc('listar_invitados', { p_token: T() }), ADM.dash.mesas);
}
function hojasExport(invs, br, pagos) {
  const C = ADM.dash.config, byAp = (a, b) => a.apellido.localeCompare(b.apellido) || a.nombre.localeCompare(b.nombre);
  const mesaN = i => i.mesa ?? 9999;
  const full = i => ({ Entrada: i.codigo, Egresado: i.responsable, 'Egresado nombre': i.responsable_nombre, Apellido: i.apellido, Nombre: i.nombre, DNI: i.dni, Edad: i.edad,
    Categoría: catLabel(i.categoria, C), Vínculo: i.vinculo, Restricción: i.restriccion, 'Detalle restricción': i.restriccion_detalle, Observaciones: i.observaciones,
    Mesa: i.mesa ?? '', Estado: i.ingreso_at ? 'ingresó' : i.estado, Precio: i.precio, Pagado: i.pagado, Saldo: i.precio - i.pagado, 'Ingreso': i.ingreso_at ? fmtDT(i.ingreso_at) : '' });
  const R = ADM.dash.responsables;
  return {
    completa: [{ file: 'invitados_completo', n: 'Invitados', rows: [...invs].sort((a, b) => a.responsable_id - b.responsable_id || a.codigo.localeCompare(b.codigo)).map(full) }],
    sarmiento: [{ file: 'lista_club_sarmiento', n: 'Club Sarmiento', rows: invs.filter(i => i.estado === 'confirmado').sort((a, b) => mesaN(a) - mesaN(b) || byAp(a, b)).map(i => ({
      Nombre: i.nombre, Apellido: i.apellido, DNI: i.dni, Edad: i.edad, Categoría: catLabel(i.categoria, C), Mesa: i.mesa ?? 'Sin asignar',
      'Restricción alimentaria': i.restriccion === 'Sin restricción' ? '' : restrTxt(i), Observaciones: i.observaciones })) }],
    egresado: [{ file: 'invitados_por_egresado', n: 'Por egresado', rows: [...invs].sort((a, b) => a.responsable.localeCompare(b.responsable) || a.codigo.localeCompare(b.codigo)).map(full) }],
    mesa: [{ file: 'invitados_por_mesa', n: 'Por mesa', rows: [...invs].sort((a, b) => mesaN(a) - mesaN(b) || byAp(a, b)).map(i => ({ Mesa: i.mesa ?? 'Sin asignar', ...full(i) })) }],
    restric: [
      { file: 'restricciones_por_mesa', n: 'Resumen por mesa', rows: [...new Set(invs.map(mesaN))].sort((a, b) => a - b).map(m => { const L = invs.filter(i => mesaN(i) === m);
        return { Mesa: m === 9999 ? 'Sin asignar' : m, Personas: L.length, Celíacos: L.filter(i => i.restriccion === 'Celíaco').length, Vegetarianos: L.filter(i => i.restriccion === 'Vegetariano').length,
          Hipertensos: L.filter(i => i.restriccion === 'Hipertenso').length, Otras: L.filter(i => i.restriccion === 'Otra').length, 'Menús comunes': L.filter(i => i.restriccion === 'Sin restricción').length }; }) },
      { n: 'Detalle restricciones', rows: invs.filter(i => i.restriccion !== 'Sin restricción').sort((a, b) => mesaN(a) - mesaN(b) || byAp(a, b)).map(i => ({ Mesa: i.mesa ?? 'Sin asignar', Apellido: i.apellido, Nombre: i.nombre, DNI: i.dni, Categoría: catLabel(i.categoria, C), Restricción: restrTxt(i), Observaciones: i.observaciones, Entrada: i.codigo })) }],
    pagos: [
      { file: 'estado_de_pagos', n: 'Estado por invitado', rows: [...invs].sort((a, b) => a.codigo.localeCompare(b.codigo)).map(i => ({ Entrada: i.codigo, Egresado: i.responsable, Apellido: i.apellido, Nombre: i.nombre, Categoría: catLabel(i.categoria, C), Estado: i.vencido ? 'vencido' : i.estado, Precio: i.precio, Pagado: i.pagado, 'Informado s/verificar': i.informado, Saldo: i.precio - i.pagado, 'Reserva vence': i.vence_en ? fmtDT(i.vence_en) : '' })) },
      { n: 'Historial pagos', rows: pagos.map(p => ({ Fecha: fmtDT(p.creado), Entrada: p.codigo, Invitado: p.nombre, Egresado: p.responsable, Monto: p.monto, Medio: p.medio, Referencia: p.referencia, Estado: p.estado, 'Registró': p.registrado_por || p.informado_por })) }],
    acred: [{ file: 'lista_acreditacion', n: 'Acreditación', rows: [...invs].sort(byAp).map(i => ({ Apellido: i.apellido, Nombre: i.nombre, DNI: i.dni, Entrada: i.codigo, Mesa: i.mesa ?? '', Restricción: i.restriccion === 'Sin restricción' ? '' : restrTxt(i), Estado: i.estado, 'Hora ingreso': i.ingreso_at ? fmtDT(i.ingreso_at) : '' })) }],
    brindis: [{ file: 'lista_brindis', n: 'Brindis', rows: br.map(b => ({ Pulsera: b.codigo || '', Apellido: b.apellido, Nombre: b.nombre, DNI: b.dni, Egresado: b.responsable, 'Egresado nombre': b.responsable_nombre, Pagado: b.pagado ? 'Sí' : 'No', Monto: b.monto, Medio: b.medio, Ingresó: b.ingreso_at ? 'Sí' : 'No', 'Hora ingreso': b.ingreso_at ? fmtDT(b.ingreso_at) : '' })) }],
    finanzas: [{ file: 'resumen_financiero', n: 'Finanzas por egresado', rows: R.filter(r => r.activo).map(r => ({ Código: r.codigo, Nombre: `${r.nombre} ${r.apellido}`, 'Cupo inicial': r.cupo_inicial, 'Extras solicitados': r.extras_solicitados, 'Extras asignados': r.cupo_extra, Liberado: r.cupo_liberado, 'Cupo actual': r.cupo, Utilizado: r.usados, Pagados: r.pagados, Pendientes: r.pendientes, 'Cena esperado': r.esperado, 'Cena cobrado': r.cobrado, 'Cena pendiente': r.esperado - r.cobrado, 'Brindis (personas)': r.brindis, 'Brindis cobrado': r.brindis_cobrado, 'Total a rendir (cobrado)': r.cobrado + r.brindis_cobrado })) }]
  };
}
function imprimirAcreditacion(invs) {
  const C = CFG, L = invs.filter(i => i.estado !== 'cancelado').sort((a, b) => a.apellido.localeCompare(b.apellido) || a.nombre.localeCompare(b.nombre));
  imprimir('Lista de acreditación', `<h1>${esc(C.evento)} – Lista de ingreso (cena)</h1><div class="muted">${fmtFecha(C.fecha)} · ${esc(C.lugar)} · generada ${new Date().toLocaleString('es-AR')} · Solo pueden ingresar los CONFIRMADOS.</div><br>
  <table><tr><th>✓</th><th>Apellido y nombre</th><th>DNI</th><th>Entrada</th><th>Mesa</th><th>Restricción</th><th>Estado</th></tr>
  ${L.map(i => `<tr><td><span class="box"></span></td><td><b>${esc(i.apellido)}</b>, ${esc(i.nombre)}</td><td>${esc(i.dni)}</td><td>${esc(i.codigo)}</td><td>${i.mesa ?? ''}</td><td>${i.restriccion !== 'Sin restricción' ? esc(restrTxt(i)) : ''}</td><td>${i.estado === 'confirmado' ? 'CONFIRMADO' : '<b>NO HABILITADO (' + i.estado + ')</b>'}${i.ingreso_at ? ' · ingresó ' + fmtDT(i.ingreso_at) : ''}</td></tr>`).join('')}</table>`);
}
function imprimirBrindis(br) {
  const C = CFG, L = [...br].sort((a, b) => (a.pulsera || 1e9) - (b.pulsera || 1e9));
  imprimir('Lista brindis', `<h1>${esc(C.evento)} – Lista del brindis</h1><div class="muted">Solo ingresan con pulsera asignada Y pago registrado.</div><br>
  <table><tr><th>✓</th><th>Pulsera</th><th>Apellido y nombre</th><th>DNI</th><th>Invita</th><th>Pagado</th></tr>
  ${L.map(b => `<tr><td><span class="box"></span></td><td><b>${b.codigo || '—'}</b></td><td>${esc(b.apellido)}, ${esc(b.nombre)}</td><td>${esc(b.dni)}</td><td>${esc(b.responsable)} ${esc(b.responsable_nombre)}</td><td>${b.pagado ? 'SÍ' : '<b>NO</b>'}</td></tr>`).join('')}</table>`);
}

// =====================================================================
//  ACREDITACIÓN (check-in) – optimizada para celular
// =====================================================================
const CI = { modo: 'cena', scanner: null, lista: null };
async function viewCheckin(embedded = false) {
  if (!embedded) { shell(`Acreditación · ${S.nombre}`, null); }
  const box = $('#main');
  box.innerHTML = `<div style="max-width:640px;margin:0 auto">
    <div class="row sb" style="margin-bottom:10px"><div class="row"><button class="btn ${CI.modo === 'cena' ? 'p' : ''}" data-modo="cena">Cena (QR)</button><button class="btn ${CI.modo === 'brindis' ? 'p' : ''}" data-modo="brindis">Brindis (pulsera)</button></div>
      <div class="small muted" id="ci-stats"></div></div>
    <div id="ci-net"></div>
    <div class="ci-search"><input id="ci-q" placeholder="${CI.modo === 'cena' ? 'Apellido, nombre, DNI o entrada' : 'N° pulsera, apellido o DNI'}" autocomplete="off" inputmode="search">
      ${CI.modo === 'cena' ? '<button class="btn p" id="ci-scan">📷 QR</button>' : ''}</div>
    <div id="reader"></div><div id="ci-res"></div>
    <div class="row no-print" style="margin-top:18px"><button class="btn s" id="ci-refresh">Actualizar lista offline</button><button class="btn s" id="ci-print">Imprimir lista de respaldo</button></div>
  </div>`;
  $$('[data-modo]').forEach(b => b.onclick = () => { CI.modo = b.dataset.modo; stopScan(); viewCheckin(embedded); });
  const q = $('#ci-q'); let tmr;
  q.oninput = () => { clearTimeout(tmr); tmr = setTimeout(() => buscarCI(q.value), 350); };
  q.onkeydown = e => { if (e.key === 'Enter') { clearTimeout(tmr); buscarCI(q.value); } };
  if ($('#ci-scan')) $('#ci-scan').onclick = () => CI.scanner ? stopScan() : startScan();
  $('#ci-refresh').onclick = () => cargarListaCI(true);
  $('#ci-print').onclick = async () => { await cargarListaCI(); const Lc = CI.lista?.cena || [];
    if (CI.modo === 'brindis') return imprimirBrindis(CI.lista?.brindis || []);
    imprimirAcreditacion(Lc.map(x => ({ nombre: x.n, apellido: x.a, dni: x.d, codigo: x.c, mesa: x.m, restriccion: x.r.startsWith('Otra') ? 'Otra' : x.r, restriccion_detalle: x.r.replace(/^Otra: /, ''), estado: x.e, ingreso_at: x.in }))); };
  cargarListaCI();
  const pend = store.get('egreso_pending_qr'); if (pend) { store.del('egreso_pending_qr'); buscarCI(pend, true); }
  if (!('ontouchstart' in window)) q.focus();
}
async function cargarListaCI(force) {
  try {
    CI.lista = await rpc('checkin_lista', { p_token: T() });
    if (!CFG) CFG = { ...CI.lista.config };
    store.set('egreso_lista_ci', { t: Date.now(), d: CI.lista });
    const s = CI.lista.stats;
    if ($('#ci-stats')) $('#ci-stats').innerHTML = CI.modo === 'cena' ? `Ingresados <b>${s.ingresados}</b> / ${s.confirmados}` : `Brindis <b>${s.brindis_ingresados}</b> / ${s.brindis_habilitados}`;
    if ($('#ci-net')) $('#ci-net').innerHTML = '';
    if (force) toast('Lista actualizada');
  } catch (e) {
    const c = store.get('egreso_lista_ci'); if (c) CI.lista = c.d;
    if ($('#ci-net')) $('#ci-net').innerHTML = `<div class="notice warn">Sin conexión. ${c ? `Búsqueda con lista guardada (${fmtDT(c.t)}). Para registrar ingresos hace falta conexión; si no vuelve, usar la lista impresa.` : ''}</div>`;
  }
}
async function buscarCI(q, auto) {
  q = (q || '').trim(); const res = $('#ci-res'); if (!res) return;
  if (q.length < (CI.modo === 'brindis' ? 1 : 2)) { res.innerHTML = ''; return; }
  res.innerHTML = '<div class="empty">Buscando…</div>';
  let L;
  try {
    L = await rpc(CI.modo === 'cena' ? 'checkin_buscar' : 'brindis_buscar', { p_token: T(), p_q: q });
    if ($('#ci-net')) $('#ci-net').innerHTML = '';
  } catch (e) {
    if (!e.offline) { res.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; return; }
    return buscarOffline(q);
  }
  if (!L.length) { res.innerHTML = `<div class="ci-card" style="border-color:var(--bad);background:var(--bad-bg)"><div class="name" style="color:var(--bad)">NO REGISTRADO</div><div>No figura en el sistema. No puede ingresar.</div></div>`; return; }
  if (auto && CI.modo === 'cena' && L[0].ingreso_at) { cardCI(L[0]); return resultado('bad', 'ENTRADA YA UTILIZADA', L[0], L[0].ingreso_at); }
  if (L.length === 1 || auto) return cardCI(L[0]);
  res.innerHTML = L.map((x, k) => `<div class="ci-row" data-k="${k}"><div><div class="n">${esc(x.apellido)}, ${esc(x.nombre)}</div><div class="small muted">${CI.modo === 'cena' ? `${esc(x.codigo)} · DNI ${esc(x.dni)} · Mesa ${x.mesa ?? '—'}` : `${x.codigo || 'sin pulsera'} · DNI ${esc(x.dni)}`}</div></div>
    <div>${CI.modo === 'cena' ? estadoBadge(x) : x.ingreso_at ? '<span class="b ing">INGRESÓ</span>' : x.pagado ? '<span class="b confirmado">PAGADO</span>' : '<span class="b pendiente">NO PAGÓ</span>'}</div></div>`).join('');
  $$('.ci-row', res).forEach(r => r.onclick = () => cardCI(L[+r.dataset.k]));
}
function buscarOffline(q) {
  const res = $('#ci-res'), L0 = CI.lista; if (!L0) { res.innerHTML = '<div class="notice bad">Sin conexión y sin lista guardada. Usar la lista impresa.</div>'; return; }
  const n = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); const qq = n(q);
  const L = CI.modo === 'cena' ? L0.cena.filter(x => n(`${x.n} ${x.a} ${x.a} ${x.n} ${x.d} ${x.c}`).includes(qq)).slice(0, 20)
    : L0.brindis.filter(x => n(`${x.nombre} ${x.apellido} ${x.dni} ${x.codigo}`).includes(qq)).slice(0, 20);
  res.innerHTML = `<div class="notice warn">SIN CONEXIÓN · datos de la lista guardada. No se puede registrar el ingreso hasta que vuelva la señal.</div>` +
    (L.map(x => CI.modo === 'cena' ? `<div class="ci-row"><div><div class="n">${esc(x.a)}, ${esc(x.n)}</div><div class="small muted">${esc(x.c)} · DNI ${esc(x.d)} · Mesa ${x.m ?? '—'} · ${esc(x.r)}</div></div><div><span class="b ${x.in ? 'ing' : x.e}">${x.in ? 'INGRESÓ' : x.e.toUpperCase()}</span></div></div>`
      : `<div class="ci-row"><div><div class="n">${esc(x.apellido)}, ${esc(x.nombre)}</div><div class="small muted">${x.codigo || 'sin pulsera'} · DNI ${esc(x.dni)}</div></div><div>${x.pagado ? 'PAGADO' : 'NO PAGÓ'}</div></div>`).join('') || '<div class="empty">Sin resultados</div>');
}
function cardCI(x) {
  const res = $('#ci-res');
  if (CI.modo === 'cena') {
    const ok = x.estado === 'confirmado' && !x.ingreso_at;
    const col = x.ingreso_at ? 'var(--bad)' : ok ? 'var(--ok)' : 'var(--warn)';
    res.innerHTML = `<div class="ci-card" style="border-color:${col}">
      <div class="name">${esc(x.nombre)} ${esc(x.apellido)}</div>
      <div class="kv"><span>Entrada:</span><b>${esc(x.codigo)}</b><span>Mesa:</span><b>${x.mesa ?? 'Sin asignar'}</b>
        <span>Restricción:</span><b class="${x.restriccion !== 'Sin restricción' ? 'restr' : ''}">${esc(restrTxt(x)).toUpperCase()}</b>
        <span>Categoría:</span><b>${catLabel(x.categoria)}</b><span>DNI:</span><b>${esc(x.dni)}</b>
        <span>Estado:</span><b style="color:${col}">${x.ingreso_at ? 'YA INGRESÓ ' + fmtDT(x.ingreso_at) : x.estado.toUpperCase()}</b>
        <span>Invita:</span><b>${esc(x.responsable)} ${esc(x.responsable_nombre)}</b></div>
      ${x.observaciones ? `<div class="small" style="margin-top:8px">Obs.: ${esc(x.observaciones)}</div>` : ''}
      <button class="bigbtn" id="ci-go" ${ok ? '' : 'disabled'}>${x.ingreso_at ? 'ENTRADA YA UTILIZADA' : ok ? 'REGISTRAR INGRESO' : 'NO HABILITADO – ' + x.estado.toUpperCase()}</button></div>`;
    if (ok) $('#ci-go').onclick = async e => {
      e.target.disabled = true;
      try { const r = await rpc('checkin_registrar', { p_token: T(), p_id: x.id }); resultado(r.ok ? 'ok' : 'bad', r.mensaje, x, r.ingreso_at); }
      catch (err) { e.target.disabled = false; toast(err.message, true); }
    };
  } else {
    const ok = x.pagado && x.codigo && !x.ingreso_at;
    const col = x.ingreso_at ? 'var(--bad)' : ok ? 'var(--ok)' : 'var(--warn)';
    res.innerHTML = `<div class="ci-card" style="border-color:${col}"><div class="name">${esc(x.nombre)} ${esc(x.apellido)}</div>
      <div class="kv"><span>Pulsera:</span><b style="font-size:26px">${x.codigo || 'SIN ASIGNAR'}</b><span>DNI:</span><b>${esc(x.dni)}</b><span>Invita:</span><b>${esc(x.responsable)} ${esc(x.responsable_nombre)}</b>
      <span>Pagado:</span><b style="color:${x.pagado ? 'var(--ok)' : 'var(--bad)'}">${x.pagado ? 'SÍ' : 'NO'}</b>${x.ingreso_at ? `<span>Ingresó:</span><b style="color:var(--bad)">${fmtDT(x.ingreso_at)}</b>` : ''}</div>
      <p class="small">Verificar que el número de la pulsera coincida y el DNI.</p>
      <button class="bigbtn" id="ci-go" ${ok ? '' : 'disabled'}>${x.ingreso_at ? 'YA INGRESÓ' : ok ? 'REGISTRAR INGRESO' : !x.codigo ? 'SIN PULSERA ASIGNADA' : 'NO PAGADO'}</button></div>`;
    if (ok) $('#ci-go').onclick = async e => {
      e.target.disabled = true;
      try { const r = await rpc('brindis_registrar', { p_token: T(), p_id: x.id }); resultado(r.ok ? 'ok' : 'bad', r.mensaje, { ...x, codigo: x.codigo }, r.ingreso_at); }
      catch (err) { e.target.disabled = false; toast(err.message, true); }
    };
  }
}
function resultado(tipo, msg, x, cuando) {
  try { navigator.vibrate && navigator.vibrate(tipo === 'ok' ? 120 : [200, 100, 200]); } catch (e) { }
  const d = document.createElement('div'); d.className = 'res ' + tipo;
  d.innerHTML = `<div class="m">${esc(msg)}</div><div class="n">${esc(x.nombre)} ${esc(x.apellido)}</div>
    <div class="d">${esc(x.codigo || '')}${x.mesa ? ' · MESA ' + x.mesa : ''}${x.restriccion && x.restriccion !== 'Sin restricción' ? ' · ' + esc(restrTxt(x)).toUpperCase() : ''}</div>
    ${cuando ? `<div class="d">Ingresó: ${fmtDT(cuando)}</div>` : ''}<div class="x">Tocá para continuar</div>`;
  d.onclick = () => { d.remove(); $('#ci-res').innerHTML = ''; const q = $('#ci-q'); if (q) { q.value = ''; if (!('ontouchstart' in window)) q.focus(); } cargarListaCI(); };
  document.body.appendChild(d);
}
async function startScan() {
  try { await loadScript(LIB.scan); } catch (e) { return toast('No se pudo cargar el lector de QR. Buscá manualmente.', true); }
  $('#ci-scan').textContent = '✕ Cerrar';
  CI.scanner = new Html5Qrcode('reader');
  try {
    await CI.scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 } }, txt => {
      stopScan();
      const m = txt.match(/e=([0-9a-f]{32})/) || txt.match(/^([0-9a-f]{32})$/);
      if (!m) { resultado('bad', 'QR NO VÁLIDO', { nombre: 'Este QR no es', apellido: 'una entrada del evento' }); return; }
      buscarCI(m[1], true);
    });
  } catch (e) { toast('No se pudo abrir la cámara: ' + (e.message || e), true); stopScan(); }
}
function stopScan() {
  if (CI.scanner) { const s = CI.scanner; CI.scanner = null; s.stop().catch(() => { }).finally(() => { try { s.clear(); } catch (e) { } }); }
  if ($('#ci-scan')) $('#ci-scan').textContent = '📷 QR';
}
